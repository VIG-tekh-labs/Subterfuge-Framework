[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "subterfuge-framework"
version = "2.0.0a4"
description = "Network inventory, ARP observation and local audit reporting"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Subterfuge contributors"}]
dependencies = []

[project.optional-dependencies]
capture = ["scapy>=2.6.1,<3"]
desktop = ["PySide6>=6.7,<7"]

[project.urls]
Repository = "https://github.com/VIG-tekh-labs/Subterfuge-Framework"

[project.scripts]
subterfuge = "subterfuge.cli:main"
subterfuge-desktop = "subterfuge.desktop_entry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
subterfuge = ["static/*.html", "assets/*.svg", "browser_lab/*.json", "browser_lab/*.html", "browser_lab/*.js", "browser_lab/*.css"]
