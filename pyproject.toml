[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "subterfuge-framework"
version = "2.0.0a2"
description = "Network inventory, ARP observation and local audit reporting"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
authors = [{name = "Subterfuge contributors"}]
dependencies = []

[project.optional-dependencies]
capture = ["scapy>=2.6.1,<3"]

[project.urls]
Repository = "https://github.com/VIG-tekh-labs/Subterfuge-Framework"

[project.scripts]
subterfuge = "subterfuge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
subterfuge = ["static/*.html"]
